name: CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate n8n workflow JSON
        run: python3 -c "import json, glob; [json.load(open(f)) for f in glob.glob('workflows/*.json')]; print('workflows OK')"

      - name: Compile-check Python files
        run: python3 -m compileall -q eval App.py && echo "python OK"

      - name: Requirements are pinned
        run: |
          python3 << 'EOF'
          import re, sys
          bad = [l.strip() for l in open('requirements.txt')
                 if l.strip() and not l.startswith('#')
                 and not re.match(r'^[A-Za-z0-9_.\-]+==[0-9]', l.strip())]
          if bad:
              sys.exit(f'UNPINNED: {bad}')
          print('requirements pinned OK')
          EOF
